<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>FXT Team New Tab</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: dark; background: #0f172a; }
    body {
      width: 344px; margin: 0; padding: 20px;
      font: 14px/1.55 system-ui, sans-serif; color: #f8fafc;
      background: radial-gradient(ellipse at 0 0, #3a2955, transparent 65%),
                  radial-gradient(ellipse at 100% 100%, #223954, transparent 70%), #101726;
    }
    main { padding: 20px; border: 1px solid #ffffff24; border-radius: 18px; background: #ffffff09; }
    header { display: flex; align-items: center; gap: 12px; }
    img { width: 44px; height: 44px; border-radius: 11px; }
    h1 { margin: 0; font-size: 19px; line-height: 1.3; letter-spacing: -.025em; }
    #version { font-size: 12px; color: #c4bcd6; }
    .description { margin: 16px 0; color: #e1e4ee; }
    footer { padding-top: 15px; border-top: 1px solid #ffffff20; }
    #status { margin: 0; color: #d8e3ef; font-size: 13px; }
    #status:not(:empty) { margin-bottom: 10px; }
    button {
      width: 100%; padding: 9px 14px; font: inherit; font-weight: 600; color: #faf7ff;
      border: 1px solid #baa4ea70; border-radius: 999px; background: #ac87e42b; cursor: pointer;
    }
    button:enabled:hover { background: #ac87e447; }
    button:focus-visible { outline: 2px solid #d5c1ff; outline-offset: 3px; }
    button:disabled { opacity: .72; cursor: progress; }
  </style>
  <script src="popup.js" defer></script>
</head>
<body>
  <main>
    <header>
      <img src="icons/icon48.png" alt="">
      <div><h1>FXT Team New Tab</h1><span id="version"></span></div>
    </header>
    <p class="description">Открывает стартовую страницу FXT Team в каждой новой вкладке Chrome. Поиск и ваши ссылки доступны по Ctrl+T.</p>
    <footer>
      <p role="status" id="status"></p>
      <button type="button" id="action">Проверить обновление</button>
    </footer>
  </main>
</body>
</html>
